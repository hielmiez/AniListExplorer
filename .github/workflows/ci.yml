name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run Jest Tests
      run: npm run test

    - name: Build Next.js Application
      run: npm run build
      env:
        # We provide a dummy client ID so the build succeeds without requiring a real .env.local on GitHub
        NEXT_PUBLIC_ANILIST_CLIENT_ID: "dummy_client_id_for_github_actions"
